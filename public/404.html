<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Página não encontrada | Fluxo</title>
    <meta name="description" content="A página que você procurou não existe ou mudou de endereço." />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#F7F8FA" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <script>
      (function () {
        var dark;
        try {
          var saved = localStorage.getItem("fluxo-theme");
          dark = saved ? saved === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
        } catch (e) {
          dark = matchMedia("(prefers-color-scheme: dark)").matches;
        }
        if (dark) document.documentElement.className = "theme-dark";
      })();
    </script>
    <style>
      :root { --paper: #F7F8FA; --surface: #FFFFFF; --ink: #0F1B26; --ink-2: #475467; --line: #E6EAEE; --accent: #0E6B66; --accent-2: #1D5D8C; }
      .theme-dark { --paper: #070C11; --surface: #0E151C; --ink: #EDF2F6; --ink-2: #A7B3BF; --line: #19232D; --accent: #5FB8AF; --accent-2: #5D9BD0; }
      * { box-sizing: border-box; margin: 0; }
      body {
        min-height: 100vh; display: grid; place-items: center; padding: 24px;
        font: 16px/1.6 "Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        color: var(--ink);
        background:
          radial-gradient(42% 55% at 88% 6%, color-mix(in srgb, var(--accent-2) 20%, transparent), transparent 70%),
          radial-gradient(38% 50% at 6% 18%, color-mix(in srgb, var(--accent) 16%, transparent), transparent 70%),
          var(--paper);
      }
      main { max-width: 460px; text-align: center; }
      .code { font-size: clamp(64px, 14vw, 112px); font-weight: 600; letter-spacing: -.05em; line-height: 1; color: var(--accent); }
      h1 { margin-top: 12px; font-size: clamp(22px, 4vw, 28px); letter-spacing: -.02em; }
      p { margin-top: 8px; color: var(--ink-2); }
      .actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-top: 28px; }
      a {
        display: inline-flex; align-items: center; height: 44px; padding: 0 20px;
        font-weight: 600; font-size: 15px; text-decoration: none; border-radius: 12px;
        transition: transform .2s, box-shadow .2s;
      }
      .primary { color: #fff; background: linear-gradient(120deg, var(--accent), var(--accent-2)); }
      .theme-dark .primary { color: #070C11; }
      .ghost { color: var(--ink); background: var(--surface); border: 1px solid var(--line); }
      a:hover { transform: translateY(-2px); box-shadow: 0 10px 24px -12px rgba(16, 27, 38, .4); }
      a:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
      @media (prefers-reduced-motion: reduce) { a { transition: none; } a:hover { transform: none; } }
    </style>
  </head>
  <body>
    <main>
      <p class="code" aria-hidden="true">404</p>
      <h1>Página não encontrada</h1>
      <p>O endereço que você abriu não existe ou mudou de lugar.</p>
      <nav class="actions" aria-label="Para onde ir">
        <a class="primary" href="/">Voltar para o início</a>
        <a class="ghost" href="/#app">Abrir a demonstração do CRM</a>
      </nav>
    </main>
  </body>
</html>
